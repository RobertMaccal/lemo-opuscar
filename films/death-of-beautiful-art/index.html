<!doctype html><html><head><meta charset="utf-8"><title>The Death of Beautiful Art?</title>
<style>
html,body{margin:0;background:#0B0C0E;overflow:hidden}canvas{display:block}
@font-face{font-family:Sans;src:url(fonts/sans400.ttf);font-weight:400}
@font-face{font-family:Sans;src:url(fonts/sans600.ttf);font-weight:600}
@font-face{font-family:Sans;src:url(fonts/sans700.ttf);font-weight:700}
@font-face{font-family:Mono;src:url(fonts/mono400.ttf);font-weight:400}
@font-face{font-family:Mono;src:url(fonts/mono600.ttf);font-weight:600}
@font-face{font-family:SerifI;src:url(fonts/serifi.ttf);font-style:italic;font-weight:400}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
// THE DEATH OF BEAUTIFUL ART? — Visual Investigation, 1920×1080 @ 30 fps.
// One Canvas-2D page drawn deterministically by window.render(t). All timing comes from film.json
// (voice starts, Whisper word times, sections, subtitles), shared with the mix and the .srt.
const W = 1920, H = 1080, x = document.getElementById('c').getContext('2d');
const C = { bg:'#0B0C0E', panel:'#141619', line:'#2E3238', text:'#ECEAE4', dim:'#8B9097', faint:'#4A4F57', acc:'#FF4A2E', paper:'#E4E0D4', ink:'#1D1D1B' };
const F = { sans:'Sans', mono:'Mono', it:'SerifI' };
let FILM = null, SEC = {}, FR = 0, REC = null, K = {};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const on = (t, a) => t >= a;

// ── word clock: absolute time of the n-th spoken occurrence of a word in a sequence ──
const clean = s => s.toLowerCase().replace(/[^a-z0-9']/g, '');
function T(sid, w, n = 1, end = false) { const ws = FILM.words[sid]; let c = 0;
  for (const q of ws) if (clean(q.w) === clean(w) && ++c === n) return end ? q.t1 : q.t0;
  console.warn('word not found', sid, w, n); return FILM.vo[sid]; }

// ── assets ──
const IM = {}; let GRAIN = [];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); SEC = FILM.sections; window.DUR = FILM.dur;
  const files = { starry:'assets/starry.jpg', comedian:'assets/comedian.jpg', fountain:'assets/fountain.jpg', blind:'assets/blindman.jpg', banana:'assets/banana.jpg',
    guernica:'assets/guernica2x.jpg', demoiselles:'assets/demoiselles.jpg', brillo:'assets/brillo.jpg', gallery:'assets/gallery.jpg', lewitt:'assets/lewitt.jpg' };
  const L = Object.entries(files).map(([k, s]) => load(s).then(i => IM[k] = i));
  for (const f of ['700 40px Sans', '600 20px Sans', '400 20px Sans', '400 20px Mono', '600 20px Mono', 'italic 24px SerifI']) L.push(document.fonts.load(f));
  await Promise.all(L);
  GRAIN = []; for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 99 + 7);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  keys(); window.EV = events(); window.READY = true;
}

// ── key times (all derived from the spoken words) ──
function keys() {
  const V = FILM.vo;
  K = {
    price: 1.2, item1: T('1', 'banana'), item2: T('1', 'tape'), six: T('1', 'six'),
    split: T('1', "that's") - .15, ring1: T('1', 'comedian') - .1, rowsEnd: T('1', "sotheby's"), grocery: T('1', 'sold') - .1,
    rewind: T('1', 'so') - .1, pairRing: T('1', 'fruit'),
    s2: SEC.s2[0], skill: T('2', 'skill'), obs: T('2', 'observation'), imag: T('2', 'imagination'),
    vg: T('2', 'van') + .7, vgRing: T('2', 'window'), loupe: T('2', 'into'),
    pic: T('2', 'picasso') - .15, sides: T('2', 'picasso') + .9, gue: T('2', 'in', 1) - .15,
    s3: SEC.s3[0], back: T('3', '20') - .2, duch: T('3', 'marcel') - .2, fake: T('3', 'fake'), exhib: T('3', 'exhibition'), hid: T('3', 'they'),
    mag: T('3', 'defended') - .2, chose: T('3', 'chose'), idea3: T('3', 'what') - .5,
    s4: SEC.s4[0], boxes: T('4', 'boxes'), phil: T('4', 'philosopher'), stock: T('4', 'stockroom'), answer: T('4', 'his') - .15, artworld: T('4', 'art', 2),
    late: T('4', 'by') + .75,
    s5: SEC.s5[0], room: T('5', 'salvatore') - .15, sculpt: T('5', 'sculpture'), euros: T('5', 'euros'), invis: T('5', 'invisible'),
    cert5: T('5', 'certificate'), disp: T('5', 'display'), feet: T('5', 'feet'), yes: T('5', 'yes'), empty: T('5', 'empty'),
    s6: SEC.s6[0], detail: T('6', 'detail'), cert6: T('6', 'certificate'), replaced: T('6', 'banana', 2) - .2,
    cols: T('6', 'one') - .25, stand: T('6', 'stand'), cents: T('6', '35'),
    buy: T('6', 'so') - .15, idea6: T('6', 'idea'), symbol: T('6', 'symbol'),
    proof: T('6', 'proof') - .15, prestige: T('6', 'prestige'), scarcity: T('6', 'scarcity'), publicity: T('6', 'publicity'), price6: T('6', 'price'),
    s7: SEC.s7[0], critics: T('7', 'critics'), inst: T('7', 'institutions'), both: T('7', 'both'),
    s8: SEC.s8[0], voEnd: FILM.vo_end['8'], end: FILM.dur,
  };
}

// ── drawing primitives ──
function txt(s, X, Y, o = {}) {
  x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  if (x.globalAlpha > .001) x.fillText(s, X, Y);
  const w = x.measureText(s).width; const ga = x.globalAlpha; x.restore();
  if (REC && o.id && ga > .5) { const sz = o.s || 24, x0 = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X;
    REC.push({ id: o.id, text: s, x0, y0: Y - sz * .9, x1: x0 + w, y1: Y + sz * .25 }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
function wrap(s, maxW, o) { const toks = s.split(/(?<= )/); const out = []; let line = '';
  for (const tk of toks) { if (tw(line + tk, o) > maxW && line) { out.push(line.trimEnd()); line = tk; } else line += tk; } if (line) out.push(line.trimEnd()); return out; }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function hairK(x0, y0, x1, y1, k, c, w, dash) { if (k <= 0) return; hair(x0, y0, lerp(x0, x1, k), lerp(y0, y1, k), c, w, dash); }
function rect(X, Y, w, h, c = C.line, lw = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function rectK(X, Y, w, h, k, c = C.line, lw = 1) { if (k <= 0) return; const P = 2 * (w + h); let d = P * k; x.save(); x.strokeStyle = c; x.lineWidth = lw; x.beginPath(); x.moveTo(X, Y);
  const pts = [[X + w, Y], [X + w, Y + h], [X, Y + h], [X, Y]]; let px = X, py = Y;
  for (const [qx, qy] of pts) { const L = Math.hypot(qx - px, qy - py); if (d >= L) { x.lineTo(qx, qy); d -= L; px = qx; py = qy; } else { x.lineTo(px + (qx - px) * d / L, py + (qy - py) * d / L); break; } }
  x.stroke(); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function hatch(X, Y, w, h, c = '#1b1e22', step = 22) { x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); for (let q = X - h; q < X + w; q += step) hair(q, Y + h, q + h, Y, c); x.restore(); }
function flashRect(t, at, X, Y, w, h, d = .12) { if (t < at) return; const k = 1 - seg(t, at, at + d); if (k <= 0) return; x.save(); x.globalAlpha = k * .9; fill(X, Y, w, h, '#fff'); x.restore(); }
const cut = (t, at) => t >= at ? 1 : 0;   // elements cut in (no fades); a white flash marks the arrival
// Ring callout: thin circle drawn clockwise; at 60% a leader and label come out
function ring(cx, cy, r, k, label, side = 1, sub, id) {
  if (k <= 0) return; x.save(); x.strokeStyle = C.acc; x.lineWidth = 2.5;
  x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore();
  if (label && k > .6) { const a = seg(k, .6, .75); const lx = cx + side * (r * .72), ly = cy - r * .72, ex = lx + side * 40, ey = ly - 30;
    x.save(); x.globalAlpha *= a; hair(lx, ly, ex, ey, C.acc, 1.5); hair(ex, ey, ex + side * 14, ey, C.acc, 1.5); x.restore();
    txt(label, ex + side * 20, ey + 8, { s: 24, w: 700, al: side > 0 ? 'left' : 'right', a, id });
    if (sub) txt(sub, ex + side * 20, ey + 34, { s: 16, f: F.mono, c: C.dim, al: side > 0 ? 'left' : 'right', a }); }
}
// Source plate: one grade for everything (greyscale) — except where the film deliberately keeps colour (sat 0..1)
function plate(img, sx, sy, sw, sh, X, Y, w, h, o = {}) {
  x.save(); fill(X, Y, w, h, '#000');
  if (img) { const sat = o.sat ?? 0;
    x.filter = o.doc ? 'grayscale(1) contrast(1.05) brightness(0.86)' : sat > 0 ? `grayscale(${1 - sat}) contrast(${lerp(1.22, 1.04, sat)}) brightness(${lerp(.94, .97, sat)})` : 'grayscale(1) contrast(1.22) brightness(0.94)';
    x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.filter = 'none'; }
  if (GRAIN.length) { x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha *= o.doc ? .10 : (o.sat ?? 0) > .5 ? .12 : .22;
    const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); }
  x.restore();
  if (!o.noborder) rect(X, Y, w, h, o.border || C.line, o.bw || 1);
}
// Fill a cell without stretching; fx/fy pick the crop; z>1 pushes in. Returns source→screen mapping.
function cover(img, X, Y, w, h, o = {}, fx = .5, fy = .5, z = 1) {
  if (!img) { fill(X, Y, w, h, C.panel); rect(X, Y, w, h); return () => [X, Y]; }
  const iw = img.width, ih = img.height; let sw = iw, sh = iw * h / w; if (sh > ih) { sh = ih; sw = ih * w / h; }
  sw /= z; sh /= z; const sx = (iw - sw) * fx, sy = (ih - sh) * fy; plate(img, sx, sy, sw, sh, X, Y, w, h, o); const k = w / sw;
  return (px, py) => [X + (px - sx) * k, Y + (py - sy) * k];
}
function tag(s, X, Y, o = {}) { const w = txt(s, X + 14, Y, { s: o.s || 17, f: F.mono, c: o.c || C.text, w: 600, ls: 1, a: o.a ?? 1, id: o.id });
  x.save(); x.globalAlpha *= o.a ?? 1; fill(X, Y - 12, 6, 13, o.chip || C.text); x.restore(); return w; }
function badge(X, Y, t, at) { const k = seg(t, at, at + .06); if (k <= 0) return; x.save(); x.globalAlpha *= k; x.translate(X, Y);
  x.fillStyle = 'rgba(11,12,14,0.85)'; x.fillRect(-15, -15, 30, 30); x.strokeStyle = C.acc; x.lineWidth = 2; x.strokeRect(-15, -15, 30, 30);
  x.beginPath(); x.moveTo(-8, 0); x.lineTo(-2, 7); x.lineTo(9, -7); x.lineWidth = 3; x.stroke(); x.restore(); }
// highlight wiped left→right (red, multiply) behind a line of text
function hl(X, Y, w, h, k) { if (k <= 0) return; x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = .6; fill(X, Y, w * eo(k), h, C.acc); x.restore(); }
function hlOver(X, Y, w, h, k) { if (k <= 0) return; x.save(); x.globalAlpha = .38; fill(X, Y, w * eo(k), h, C.acc); x.restore(); }
// typewriter (telegram/transcription cards): characters appear at a steady rate
function typed(s, X, Y, t, t0, o = {}, cps = 55) { const n = Math.floor(clamp((t - t0) * cps, 0, s.length)); if (n <= 0) return 0; return txt(s.slice(0, n), X, Y, n < s.length ? { ...o, id: undefined } : o); }
// red dashed link drawn progressively
function link(x0, y0, x1, y1, k) { hairK(x0, y0, x1, y1, eo(k), C.acc, 1.6, [7, 6]); if (k >= 1) { x.save(); x.fillStyle = C.acc; x.beginPath(); x.arc(x1, y1, 4, 0, 7); x.fill(); x.restore(); } }
function arrow(x0, y0, x1, y1, k, c = C.acc, w = 2) { if (k <= 0) return; const ex = lerp(x0, x1, eo(k)), ey = lerp(y0, y1, eo(k)); hair(x0, y0, ex, ey, c, w);
  if (k > .9) { const a = Math.atan2(y1 - y0, x1 - x0); x.save(); x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(ex - 14 * Math.cos(a - .45), ey - 14 * Math.sin(a - .45)); x.lineTo(ex, ey); x.lineTo(ex - 14 * Math.cos(a + .45), ey - 14 * Math.sin(a + .45)); x.stroke(); x.restore(); } }
function panel(X, Y, w, h) { fill(X, Y, w, h, C.panel); rect(X, Y, w, h); }
function scan(a) { if (a <= 0) return; x.save(); x.globalAlpha = a * .5; for (let y = 0; y < H; y += 4) fill(0, y, W, 1, '#000'); x.restore(); }

// ═════════ picture area y 60–900; subtitles below ═════════
const STARRY = { sw: 1920, sh: 1000, moon: [3480, 520] };   // the main swirl and the moon, in source pixels (3840×3041 plate)
const COMED = { cx: 1010, cy: 690, r: 520 };                  // the banana + tape in the supplied photo (2000×1440)

// ── 1 · THE PRICE ──
function s1(t) {
  if (t < K.split) { // the price alone, as an inventory total
    if (t >= K.price) {
      tag("Sotheby's NY · 20 Nov 2024", 150, 352, { id: 'tag_price' });
      txt('$6,240,000', 140, 560, { s: 214, f: F.mono, w: 600, ls: -4, id: 'price' });
      flashRect(t, K.price, 130, 360, 1500, 230, .1);
      hairK(150, 600, 1530, 600, seg(t, K.six, K.six + .7), C.acc, 3);
      if (t >= K.item1) { txt('ITEM 01', 150, 690, { s: 24, f: F.mono, c: C.dim }); txt('BANANA', 300, 690, { s: 30, w: 700, id: 'i1' }); }
      if (t >= K.item2) { txt('ITEM 02', 150, 740, { s: 24, f: F.mono, c: C.dim }); txt('DUCT TAPE', 300, 740, { s: 30, w: 700, id: 'i2' }); }
    }
    return;
  }
  if (t < K.rewind) { // split: the work (left) · the facts (right)
    tag('Photo · supplied', 60, 108, { id: 'tag_com' });
    const m = cover(IM.comedian, 60, 120, 1000, 720);
    flashRect(t, K.split, 60, 120, 1000, 720);
    const [cx, cy] = m(COMED.cx, COMED.cy); const r = COMED.r * 1000 / 2000;
    ring(cx, cy, r, seg(t, K.ring1, K.ring1 + .5), 'BANANA + TAPE', 1, undefined, 'r_bt');
    panel(1120, 120, 740, 720); flashRect(t, K.split, 1120, 120, 740, 720);
    const rows = [['ARTIST', 'MAURIZIO CATTELAN'], ['TITLE', 'COMEDIAN'], ['YEAR OF WORK', '2019'], ['AUCTION', "20 NOV 2024 · SOTHEBY'S NEW YORK"], ['PRICE', '$6,240,000 USD']];
    rows.forEach(([l, v], i) => { const at = K.split + .25 + i * .32; if (t < at) return; const Y = 190 + i * 112;
      txt(l, 1160, Y, { s: 17, f: F.mono, c: C.dim, ls: 1 }); txt(v, 1160, Y + 44, { s: i === 3 ? 27 : 36, w: 700, c: i === 4 ? C.acc : C.text, id: 'row' + i });
      flashRect(t, at, 1150, Y - 22, 690, 80, .1); });
    const pAt = K.split + .25 + 4 * .32 + .3; // leader from the price row to the object
    if (t >= pAt) link(1150, 190 + 4 * 112 + 30, cx + r * .98, cy + 20, seg(t, pAt, pAt + .6));
    if (t >= K.grocery) { // grocery inset: same fruit, different object
      const G = { x: 84, y: 610, w: 300, h: 206 }; fill(G.x - 4, G.y - 30, G.w + 8, G.h + 34, C.bg);
      tag('Grocery · reported', G.x, G.y - 9, { s: 15, id: 'tag_groc' });
      if (IM.banana) cover(IM.banana, G.x, G.y, G.w, G.h); else bananaDrawing(G.x, G.y, G.w, G.h);
      flashRect(t, K.grocery, G.x, G.y, G.w, G.h);
      fill(G.x, G.y + G.h - 44, G.w, 44, 'rgba(11,12,14,.86)'); txt('≈ $0.35', G.x + 14, G.y + G.h - 12, { s: 30, w: 700, id: 'groc' });
      if (t >= K.grocery + .3) { txt('× 17,800,000', 1160, 772, { s: 28, f: F.mono, w: 600, c: C.acc, id: 'ratio' }); txt('price ÷ fruit', 1400, 772, { s: 17, f: F.mono, c: C.dim }); }
    }
    return;
  }
  // rewind 2024 → 1889, then the two works face each other
  const rw = seg(t, K.rewind, K.rewind + .8);
  if (rw < 1) { const yr = Math.round(lerp(2024, 1889, eio(rw)));
    txt(String(yr), W / 2, 560, { s: 220, f: F.mono, w: 600, al: 'center' }); scan(1);
    const r = rnd(FR); for (let i = 0; i < 8; i++) fill(0, r() * H, W, 1 + r() * 3, 'rgba(236,234,228,.18)'); return; }
  const A = K.rewind + .8;
  tag('Painting · MoMA', 60, 88, { id: 'tag_sn' }); tag('Photo · supplied', 980, 88, { id: 'tag_cm' });
  cover(IM.starry, 60, 100, 880, 690, { sat: 1 }, .5, .35); flashRect(t, A, 60, 100, 880, 690);
  const m = cover(IM.comedian, 980, 100, 880, 690); flashRect(t, A, 980, 100, 880, 690);
  txt('1889', 60, 868, { s: 56, f: F.mono, w: 600, id: 'y1889' }); txt('2024', 1860, 868, { s: 56, f: F.mono, w: 600, al: 'right', id: 'y2024' });
  arrow(240, 850, 1670, 850, seg(t, A + .3, A + 1.2));
  const [cx, cy] = m(COMED.cx, COMED.cy); ring(cx, cy, COMED.r * 880 / 2000 * .9, seg(t, K.pairRing, K.pairRing + .5));
}
function bananaDrawing(X, Y, w, h) { fill(X, Y, w, h, C.panel); x.save(); x.strokeStyle = C.text; x.lineWidth = 2; x.beginPath();
  x.moveTo(X + w * .2, Y + h * .3); x.quadraticCurveTo(X + w * .45, Y + h * .85, X + w * .82, Y + h * .45); x.quadraticCurveTo(X + w * .5, Y + h * .65, X + w * .2, Y + h * .3); x.stroke(); x.restore(); rect(X, Y, w, h); }

// ── 2 · THE AGE OF PAINTING ──
function s2(t) {
  if (t < K.vg) { // full frame, in colour
    const k = seg(t, K.s2, K.vg); tag('Painting · MoMA · 1889', 60, 80, { id: 'tag_sn2' });
    cover(IM.starry, 60, 92, 1800, 800, { sat: 1 }, .5, .28, lerp(1, 1.05, k)); flashRect(t, K.s2, 60, 92, 1800, 800);
    const words = [['SKILL', K.skill], ['OBSERVATION', K.obs], ['IMAGINATION', K.imag]]; let X = 84;
    if (t >= K.skill) { fill(60, 822, 760, 70, 'rgba(11,12,14,.88)'); }
    words.forEach(([w_, at], i) => { if (t < at) return; if (i) { fill(X - 22, 852, 8, 8, C.acc); }
      X += txt(w_, X, 868, { s: 30, f: F.mono, w: 600, ls: 2, id: 'w' + i }) + 40; });
    return;
  }
  if (t < K.pic) { // whole painting + ID + true-pixel magnifier on the main swirl
    const m = cover(IM.starry, 60, 92, 1000, 792, { sat: 1 }); flashRect(t, K.vg, 60, 92, 1000, 792); tag('Painting · MoMA', 60, 80, { id: 'tag_sn3' });
