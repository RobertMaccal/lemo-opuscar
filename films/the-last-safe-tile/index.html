<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Safe Tile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="stageWrap">
      <canvas id="stage" width="1080" height="1920" aria-label="The Last Safe Tile animation"></canvas>
      <div id="busy">Simulating…</div>
    </div>
    <aside id="controls" aria-label="Preview controls">
      <div class="row">
        <button id="play" title="Play / pause (Space)">Play</button>
        <button id="restart" title="Restart (R)">Restart</button>
        <button id="mute" title="Mute / unmute (M)">Sound: on</button>
      </div>
      <div class="row">
        <label>Seed <input id="seed" type="number" min="1" step="1"></label>
        <button id="loadSeed">Load</button>
        <button id="randSeed" title="Random seed">Random</button>
      </div>
      <div class="row">
        <label>Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <button id="export" title="Record a real-time WebM in the browser (fallback; npm run render makes the frame-perfect MP4)">Export (WebM)</button>
      </div>
      <input id="scrub" type="range" min="0" max="2699" value="0" aria-label="Timeline">
      <div id="readout">0.00 s · frame 0</div>
      <div id="stats"></div>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
